name: Build GxLx 1.1.6 Windows

on:
  push:
    paths:
      - 'GxLx-1.1.6-GitHub-Actions.zip'
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: windows-2022
    timeout-minutes: 120
    steps:
      - name: Check out project
        uses: actions/checkout@v4

      - name: Unpack 1.1.5 sources
        shell: pwsh
        run: |
          $archive = 'GxLx-1.1.6-GitHub-Actions.zip'
          if (!(Test-Path -LiteralPath $archive)) {
            throw 'Upload GxLx-1.1.6-GitHub-Actions.zip to the repository root.'
          }
          Expand-Archive -LiteralPath $archive -DestinationPath extracted -Force
          $project = 'extracted/GxLx-1.1.5'
          foreach ($relativePath in @('mod.json', 'CMakeLists.txt', 'src/modules/gxlx/easter-eggs.cpp', 'resources/GxLx/10clicks.mp4', 'resources/GxLx/sevvend.mp3', 'resources/GxLx/loading-logo.png')) {
            if (!(Test-Path -LiteralPath (Join-Path $project $relativePath))) {
              throw "Missing build file: $relativePath"
            }
          }
          $json = Get-Content -Raw (Join-Path $project 'mod.json') | ConvertFrom-Json
          if ($json.version -ne 'v1.1.6') { throw 'Archive does not contain version 1.1.5' }
          Write-Host 'Verified GxLx 1.1.6 code and media assets'

      - name: Build GxLx Windows x64
        id: build
        uses: geode-sdk/build-geode-mod@main
        with:
          sdk: 5.11.2
          path: extracted/GxLx-1.1.5
          target: Win64
          bindings: geode-sdk/bindings
          bindings-ref: 3e65294e5b68f0124cde08505b9ecbeb2e3d990b
          build-config: Release
          configure-args: >-
            -DGXLX_ENABLE_UNITY_BUILD=ON
            -DSKIP_BUILDING_CODEGEN=OFF
            -DCMAKE_POLICY_VERSION_MINIMUM=3.5

      - name: Save compiled mod
        uses: actions/upload-artifact@v4
        with:
          name: GxLx-1.1.6-Windows
          path: ${{ steps.build.outputs.build-output }}/*.geode
          if-no-files-found: error
